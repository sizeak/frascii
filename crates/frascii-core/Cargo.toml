[package]
name = "frascii-core"
description = "Frontend-agnostic fractal logic: escape-time kernels over the complex plane"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Empty, and the emptiest block in the workspace is the point: this is the crate
# every frontend can consume, so it holds nothing presentational and nothing
# host-bound. No colour, no glyph, no cell type, no terminal, no `std::io`.
#
# Note "no cell type", not "no grid": a *sample* grid of `Escape` values is
# this crate's output and belongs here. It is a grid of glyphs and colours
# that does not.
#
# `rayon` is the parallelism dependency that comment anticipated: the sampler
# owns the decision to go wide, precisely so the kernels do not have to know
# about threads. It is the only entry here, and a presentational one never can
# be — that is the whole boundary.
[dependencies]
rayon.workspace = true

[lints]
workspace = true
