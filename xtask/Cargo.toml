[package]
name = "xtask"
description = "Task runner for the frascii repo: cargo verify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Deliberately thin. This crate is built before every verification sweep, so a
# heavy dependency tree is a tax on the most-run command in the repo. clap is
# the one exception, and it is nearly free: the `frascii` binary depends on it
# too, so the workspace compiles it once and both share the artefact.
[dependencies]
clap.workspace = true

[lints]
workspace = true
